let selectedAttendanceEmployee='';

function attendanceSummary(employeeId,month=today.slice(0,7)){

 return heading(role==='employer'?'Attendance, with a clear record.':'Your month at a glance.',role==='employer'?'Approve check-ins and manage present days, leave, LOP and holidays.':'Check in, wait for approval, and see your confirmed attendance here.',role==='employer'?btn('Mark a day','add-attendance','plus','primary'):'')+
 `<div class="attendance-toolbar"><div><span class="label">CURRENT MONTH</span><h2>${monthLabel}</h2></div>${role==='employer'?`<div class="attendance-employee"><label for="attendance-employee">Employee</label><select id="attendance-employee">${state.employees.map(e=>`<option value="${e.id}" ${e.id===id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>`:`<span class="tag">${esc(e.name)}</span>`}</div>

function attendanceCalendar(employeeId){

 }).join('')}</div>`;

function attendanceApprovals(){const pending=pendingAttendance();return `<section class="panel"><div class="panel-head"><div><h2>Approval requests</h2><p>Check-ins awaiting your decision.</p></div><span class="approval-count">${pending.length}</span></div><div class="panel-body">${pending.map(a=>`<div class="checkin-request"><div class="rowperson">${avatar(employee(a.employee).name)}<div><strong>${esc(employee(a.employee).name)}</strong><small>${a.date} · ${esc(a.in)} IST</small></div></div><div class="actions">${btn('Approve','approve-attendance','check','small primary',`data-id="${a.id}"`)}${btn('Reject','reject-attendance','close','small',`data-id="${a.id}"`)}</div></div>`).join('')||`<div class="empty">${icon('check')}All caught up.<br>New check-ins will appear here.</div>`}</div></section>`}
function attendanceTable(date){return `<table><thead><tr><th>Employee</th><th>Check in</th><th>Check out</th><th>Status</th><th>Approval</th></tr></thead><tbody>${state.employees.filter(e=>role==='employer'||e.id===currentEmployee()).map(e=>{const a=attendanceRecord(e.id,date);return `<tr><td><strong>${esc(e.name)}</strong><small>${esc(a?.note||e.job)}</small></td><td>${esc(a?.in||'—')}</td><td>${esc(a?.out||'—')}</td><td>${badge(attendanceStatus(a))}</td><td>${a?.status==='Pending'?'Awaiting employer':a?.status==='Rejected'?'Rejected':a?'Confirmed by employer':'—'}</td></tr>`}).join('')}</tbody></table>`}
function clockPanel(){
 const a=attendanceRecord(currentEmployee(),today),pending=a?.status==='Pending',present=a?.status==='Present',closed=present&&!!a.out,marked=a&&['Leave','LOP','Holiday'].includes(a.status);
 const label=pending?'Awaiting approval':closed?'Day completed':marked?a.status:present?'Check out':a?.status==='Rejected'?'Request check-in again':'Request check-in';
 const description=pending?`Requested at ${a.in}. Your employer needs to approve this check-in.`:closed?`Checked out at ${a.out}. Attendance is confirmed.`:marked?`Today is marked ${a.status} by your employer.`:present?`Approved · checked in at ${a.in}`:a?.status==='Rejected'?'Your check-in was rejected. You may submit a new request.':'Check in to send an approval request to your employer.';
 return `<div class="clock-card"><span class="label">${fullDate()}</span><div class="clock-time">${clock()}</div><p>${esc(description)}</p>${btn(label,'clock','clock','primary',pending||closed||marked?'disabled':'')}<p class="notice-inline" style="margin:12px 0 0">India Standard Time · Approval required</p></div>`;
}
function requestCheckinOrCheckout(){
 if(role!=='employee')return;
 const id=currentEmployee(),a=attendanceRecord(id,today);
 if(!state.employees.some(e=>e.id===id))return;
 if(a?.status==='Present'&&!a.out){a.out=clock();render();toast('Checked out. Your approved attendance is retained.');return;}
 if(a&&a.status!=='Rejected')return;
 const request={id:`ATT-${Date.now()}`,employee:id,date:today,in:clock(),out:'',note:'',status:'Pending',requestedAt:new Date().toISOString()};
 if(a)Object.assign(a,request);else state.attendance.push(request);

function decideAttendance(id,decision){
 if(role!=='employer'||!session?.admin)return;
 const a=state.attendance.find(a=>a.id===id);
 if(!a||a.status!=='Pending')return toast('This request has already been reviewed.');
 a.status=decision;a.reviewedAt=new Date().toISOString();a.reviewedBy='admin';

function addAttendance(date=today,employeeId=calendarEmployee()){
 if(role!=='employer'||!session?.admin)return;

function timeInput(value){if(/^\d{2}:\d{2}$/.test(value))return value;const match=value.match(/(\d{1,2}):(\d{2})\s*(am|pm)/i);if(!match)return '';let hour=Number(match[1])%12;if(match[3].toLowerCase()==='pm')hour+=12;return `${String(hour).padStart(2,'0')}:${match[2]}`}
function updateAttendanceTimeFields(){const f=$('#modal-form');if(f?.dataset.submit!=='attendance')return;const present=$('[name=status]',f).value==='Present';for(const name of ['in','out']){const el=$(`[name="${name}"]`,f);el.disabled=!present;el.required=present&&name==='in';}}
function saveAttendanceForm(d){
 if(role!=='employer'||!session?.admin)return false;
 if(!ATTENDANCE_TYPES.includes(d.status))return error('Choose a day status.'),false;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||new Date(d.date+'T12:00:00').toISOString().slice(0,10)!==d.date)return error('Choose a valid date.'),false;

let deferredAppInstall=null;

</script><script>'use strict';
const wd={token:null,revision:0,baseline:'',saving:false,loading:false};
function rpc(name,...args){return new Promise((resolve,reject)=>{if(!window.google?.script?.run)return reject(new Error('Open the deployed Apps Script web app URL to connect.'));google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args);});}
function hydrate(data){Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,data.state);wd.revision=data.revision;wd.baseline=JSON.stringify(state);}
function render(){renderLocal();if(session&&wd.token&&!wd.loading&&!wd.saving&&JSON.stringify(state)!==wd.baseline)saveRemote();}
function busy(value){document.getElementById('sync-mask')?.remove();if(value){const div=document.createElement('div');div.id='sync-mask';div.setAttribute('role','status');div.textContent='Saving to Google Sheets…';div.style.cssText='position:fixed;inset:0;z-index:99999;background:#fffffff0;display:grid;place-items:center;font:600 18px system-ui;color:#164e46';document.body.append(div);}}
async function saveRemote(){
 wd.saving=true;busy(true);const payload=JSON.parse(JSON.stringify(state));
 try{const data=await rpc('wdSave',wd.token,wd.revision,payload);hydrate(data);renderLocal();toastLocal('Saved to Google Sheets.');}
 catch(e){
   // A failed response can mean a write completed but its reply was lost. Read before retrying.
   try{hydrate(await rpc('wdRead',wd.token));}catch{Object.assign(state,JSON.parse(wd.baseline));}
   closeModal();renderLocal();openModal('Save could not be confirmed',`<p>${esc(e.message||String(e))}</p><p class="notice-inline">Check the latest data before repeating your change. This page does not save an offline copy.</p>`,btn('Review data','close','','primary'));
 }finally{wd.saving=false;busy(false);}
}
function toast(message){if(wd.saving)return;toastLocal(message);}
async function login(form){
 const d=new FormData(form),err=$('#login-error'),button=form.querySelector('[type=submit]');button.disabled=true;err.textContent='Signing in…';
 try{const data=await rpc('wdLogin',String(d.get('username')).trim(),String(d.get('password')));wd.token=data.token;hydrate(data);session=data.session;role=session.admin?'employer':'employee';page='Dashboard';query='';jobFilter='All jobs';renderLocal();}

ory)}</td><td><strong>${p.stock}</strong> <span class="muted">${esc(p.unit)}</span></td><td>${money(p.price)}</td><td>${p.configured?badge(stockStatus(p)):'<span class="pill gray">Not configured</span>'}</td><td><div class="actions">${p.stock>0?btn('Issue','issue-part','','small',`data-id="${p.id}"`):btn('Request','request-stock','','small',`data-id="${p.id}"`)}${role==='employer'?`<button class="iconbtn" aria-label="Edit ${esc(p.name)}" data-action="edit-part" data-id="${p.id}">${icon('edit')}</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No matching parts. Add a new item or request it.</td></tr>'}</tbody></table></div>`}
function employeesPage(){return heading('Meet your workshop team.','Assign the right people to every job.',btn('Add employee','new-employee','plus','primary'))+`<div class="toolbar">${searchBox('Search your team…')}</div><div class="job-grid">${state.employees.filter(e=>`${e.name} ${e.job}`.toLowerCase().includes(query.toLowerCase())).map(e=>`<article class="job-card"><div class="job-top">${avatar(e.name)}${badge(attendanceStatus(attendanceRecord(e.id,today)))}</div><h3>${esc(e.name)}</h3><p class="small muted">${esc(e.job)}</p><p class="small muted" style="margin-top:17px">${esc(e.phone)}<br><span style="display:block;margin-top:6px">${esc(e.email)}</span></p><div class="job-bottom" style="margin-top:20px"><span class="small">${state.jobs.filter(j=>j.assigned===e.id&&jobStatus(j)!=='Finished').length} active jobs</span>${btn('Edit','edit-employee','edit','small',`data-id="${e.id}"`)}</div></article>`).join('')}</div><p class="notice-inline">Employees log in with their phone number and the password set by the admin. Accounts are checked by the server; employee passwords can be reset here.</p>`}
function invoicesPage(){const rows=state.invoices.filter(i=>`${i.id} ${customer(state.jobs.find(j=>j.id===i.job)).name} ${i.type} ${i.status}`.toLowerCase().includes(query.toLowerCase()));return heading('Great work deserves a clear bill.','Create estimates, print invoices and track your daily collections.',btn('New estimate','new-estimate','receipt')+btn('New invoice','new-invoice','plus','primary'))+`<div class="summary-cards">${metric('Collected today',money(state.invoices.filter(i=>i.paidDate===today&&i.status==='Paid').reduce((s,i)=>s+total(i),0)),'rupee','Paid|invoices')}${metric('Outstanding',money(state.invoices.filter(i=>i.type==='Invoice'&&i.status==='Unpaid').reduce((s,i)=>s+total(i),0)),'receipt','Awaiting|payment','orange')}${metric('Estimates',state.invoices.filter(i=>i.type==='Estimate').length,'jobs','Prepared|for customers','blue')}</div><div class="toolbar">${searchBox('Search document or customer…')}</div><div class="panel table-wrap"><table><thead><tr><th>Document</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(i=>`<tr><td><strong>${i.id}</strong><small>${i.type} · ${i.job}</small></td><td>${esc(customer(state.jobs.find(j=>j.id===i.job)).name)}</td><td>${i.date}</td><td><strong>${money(total(i))}</strong></td><td>${badge(i.type==='Estimate'?'Estimate':i.status)}</td><td><div class="invoice-actions">${btn('Preview','invoice-preview','receipt','small',`data-id="${i.id}"`)}${i.type==='Invoice'&&i.status!=='Paid'?btn('Mark paid','mark-paid','check','small light',`data-id="${i.id}"`):i.type==='Estimate'?btn('Invoice','convert-invoice','arrow','small',`data-id="${i.id}"`):''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No documents found.</td></tr>'}</tbody></table></div>`}
function catalogPage(){const brands=Object.entries(CARS).filter(([b,models])=>`${b} ${models.join(' ')}`.toLowerCase().includes(query.toLowerCase()));return heading('Every brand. One workshop.',`${Object.keys(CARS).length} brands · ${Object.values(CARS).flat().length} model suggestions · Current and discontinued vehicles`,btn('Custom vehicle','new-customer','plus','primary'))+`<div class="toolbar">${searchBox('Search a car brand or model…')}</div><div class="info">An India-focused workshop reference, including older cars still on the road. Choose a brand and model when adding a customer or job card. Type a custom model for any vehicle not listed; this is not a live availability or parts-fitment database.</div><div class="catalog-grid">${brands.map(([b,models])=>`<button class="brand-card" data-action="brand" data-brand="${esc(b)}"><span class="brand-initial">${esc(initials(b))}</span><h3>${esc(b)}</h3><small>${models.length} models ${query?'· '+models.filter(m=>m.toLowerCase().includes(query.toLowerCase())).slice(0,2).map(esc).join(', '):''}</small></button>`).join('')}</div><p class="notice-inline">Reference starting points: <a href="https:\x2f\x2fwww.marutisuzuki.com/" target="_blank" rel="noopener">Maruti Suzuki</a>, <a href="https:\x2f\x2fwww.hyundai.com/in/en" target="_blank" rel="noopener">Hyundai India</a>, <a href="https:\x2f\x2fauto.mahindra.com/suv" target="_blank" rel="noopener">Mahindra</a>. Model suggestions also include historical workshop vehicles.</p>`}
function workshopSettingsPage(){const s=state.settings;return heading('Make it your workshop.','Your shop details appear automatically on every invoice, estimate and job card.',btn('Clear','clear-form','close','','data-form="settings-form"')+btn('Save settings','save-settings','check','primary'))+`<div class="settings-layout"><section class="panel"><div class="panel-head"><h2>Workshop profile</h2><span class="tag">Employer only</span></div><div class="panel-body"><div class="logo-upload"><div class="logo-preview" id="logo-preview">${s.logo?`<img src="${s.logo}" alt="Shop logo">`:icon('wrench')}</div><div><strong class="small">Your workshop logo</strong><p class="notice-inline" style="margin:5px 0 8px">PNG or JPG, up to 2 MB</p><input type="file" id="logo-file" accept="image/png,image/jpeg" aria-label="Upload shop logo"></div></div><form id="settings-form"><div class="form-grid">${field('Shop name','name',s.name,'text',true,true)}${field('Phone / WhatsApp','phone',s.phone,'text',true)}${field('GSTIN (optional)','gst',s.gst)}${field('Workshop address','address',s.address,'textarea',true,true)}${field('Invoice footer','footer',s.footer,'textarea',false,true)}</div></form><div class="info" style="margin-top:22px;margin-bottom:0">Saved shop details appear on invoices, estimates and job cards on every device.</div></div></section><section><div class="panel-head" style="padding-left:0"><h2>Document preview</h2><span class="tag">A4 print ready</span></div><div class="invoice-mini"><div style="display:flex;justify-content:space-between"><div>${s.logo?`<img src="${s.logo}" class="doc-logo" alt="Shop logo">`:''}<h3>${esc(s.name)}</h3><p>${esc(s.address)}<br>${esc(s.phone)}</p></div><span class="label">INVOICE</span></div><div class="mini-rule"></div><div style="display:flex;justify-content:space-between"><span>Bill to<br><strong>Customer name</strong></span><span>INV-2026-001</span></div><div class="mini-rule"></div><p>Service & repair details</p><div class="mini-rule"></div><p style="text-align:right">Total <strong style="font-size:20px;color:#3d5630">₹ 0</strong></p><p style="margin-top:60px;text-align:center">${esc(s.footer)}</p></div><p class="notice-inline">Use print preview to print directly, or choose “Save as PDF” in your browser.</p></section></div>`}
function field(label,name,value='',type='text',required=false,full=false,extra=''){return `<div class="form-group ${full?'full':''}"><label for="f-${name}">${label}${required?' *':''}</label>${type==='textarea'?`<textarea id="f-${name}" name="${name}" ${required?'required':''} ${extra}>${esc(value)}</textarea>`:`<input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${extra}>`}</div>`}
function selectField(label,name,options,value='',full=false){return `<div class="form-group ${full?'full':''}"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`}
function vehicleFields(v={}){return `${field('Car brand','brand',v.brand||'','text',true,false,'list="brands" autocomplete="off"')}${field('Car model','model',v.model||'','text',true,false,'list="models" autocomplete="off"')}<datalist id="brands">${Object.keys(CARS).map(b=>`<option value="${esc(b)}">`).join('')}</datalist><datalist id="models">${(CARS[v.brand]||[]).map(m=>`<option value="${esc(m)}">`).join('')}</datalist>${field('Registration number','plate',v.plate||'','text',true)}${field('Odometer (km)','odometer',v.odometer||'','number',false,false,'min="0" max="9999999"')}`}
function openModal(title,content,footer='',wide=false,subtitle=''){previousFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><div><h2 id="modal-title">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="iconbtn" data-action="close" aria-label="Close dialog">${icon('close')}</button></header><div class="modal-content">${content}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>$('.modal input, .modal select, .modal button')?.focus(),20);}
function closeModal(){ $('#modal-root').innerHTML='';document.body.style.overflow='';if(previousFocus?.isConnected)previousFocus.focus();}
function formModal(title,body,submit,wide=false,subtitle=''){openModal(title,`<form id="modal-form" method="post" data-submit="${submit}"><div id="form-error"></div>${body}</form>`,btn('Clear','clear-form','close','','data-form="modal-form"')+btn('Cancel','close')+`<button class="btn primary" type="submit" form="modal-form">${icon('check')}Save in preview</button>`,wide,subtitle)}
function error(text){const el=$('#form-error');if(el){el.className='error';el.textContent=text;}else toast(text)}
function toastLocal(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3500)}
function newCustomer(id){const c=state.customers.find(c=>c.id===id)||{};formModal(id?'Edit customer':'A new connection',`<input type="hidden" name="id" value="${id||''}"><div class="form-grid">${field('Customer name','name',c.name,'text',true)}${field('WhatsApp with country code','phone',c.phone||'91','tel',true,false,'pattern="[0-9+ ()-]{10,20}" placeholder="919876543210"')}${field('Address','address',c.address,'textarea',false,true)}</div><div class="section-label">Vehicle details · type to search or add custom</div><div class="form-grid">${vehicleFields(c)}</div>`,'customer',false,'Basic details for better service and easy updates.');}
function serviceLine(name='',price='',type='Service'){return `<div class="service-line"><input name="serviceName" placeholder="Service / repair / painting task" value="${esc(name)}" required maxlength="120"><input name="servicePrice" aria-label="Labour charge" type="number" value="${price}" min="0" max="10000000" step=".01" placeholder="₹ charge" required><button type="button" class="iconbtn" data-action="remove-line" aria-label="Remove task">${icon('close')}</button><select name="serviceType" aria-label="Work type" style="grid-column:1/-1;padding:7px;font-size:10px">${['Service','Repair','Painting','Inspection'].map(t=>`<option ${t===type?'selected':''}>${t}</option>`).join('')}</select></div>`}
function newJob(){const c=state.customers[0]||{};if(!state.customers.length){newCustomer();toast('Add your first customer, then create a job card.');return}formModal('Let’s get this car back on the road.',`<div class="form-grid">${selectField('Customer','customer',state.customers.map(c=>[c.id,`${c.name} · ${c.plate}`]),c.id,true)}${selectField('Assigned to','assigned',state.employees.map(e=>[e.id,e.name]),role==='employee'?currentEmployee():'')}${field('Expected completion','due',today,'date',true)}</div><div class="section-label">Vehicle · searchable brand and model</div><div class="form-grid">${vehicleFields(c)}${selectField('Fuel type','fuel',['Petrol','Diesel','CNG','Electric','Hybrid','LPG'])}${field('Customer concerns / inspection notes','notes','','textarea',false,true)}</div><div class="section-label">Service, repair & painting tasks</div><div id="service-lines">${serviceLine()}</div>${btn('Add another task','add-service','plus','small')}`,'job',true,'Each task can be updated independently by the assigned employee.');}
function jobDetail(id){const j=state.jobs.find(j=>j.id===id),c=customer(j);if(!j)return;openModal(`#${j.id}`,`<div class="detail-banner">${icon('car')}<div><h2>${esc(j.brand)} ${esc(j.model)}</h2><p>${esc(c.name)} · <span class="plate">${esc(j.plate)}</span></p></div><div style="margin-left:auto">${badge(jobStatus(j))}</div></div><div class="detail-info"><div><small>Assigned to</small>${role==='employer'?`<select id="detail-assigned" data-id="${j.id}" style="padding:7px;font-size:11px">${state.employees.map(e=>`<option value="${e.id}" ${e.id===j.assigned?'selected':''}>${esc(e.name)}</option>`).join('')}</select>`:esc(employee(j.assigned).name)}</div><div><small>Odometer / fuel</small>${esc(j.odometer||'—')} km · ${esc(j.fuel)}</div><div><small>Expected completion</small>${j.due}</div></div><div class="info">${esc(j.notes||'No additional concerns recorded.')}</div><div class="section-label">Tasks & progress</div>${j.services.map((s,i)=>`<div class="task"><div><strong>${esc(s.name)}</strong><small>${esc(s.type||'Service')} · Labour ${money(s.price)}</small></div><select class="task-status" data-id="${j.id}" data-index="${i}" aria-label="Status for ${esc(s.name)}">${['Pending','In progress','Finished'].map(v=>`<option ${v===s.status?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}<div class="section-label">Parts issued to this job</div>${j.issued.length?j.issued.map(x=>`<div class="task"><strong>${esc(x.name)}</strong><span>${x.qty} × ${money(x.price)}</span></div>`).join(''):'<p class="small muted">No parts issued yet. Use Inventory → Issue to add parts.</p>'}<div class="actions" style="margin-top:23px">${role==='employer'?btn('WhatsApp update','whatsapp','chat','light',`data-id="${j.id}"`):''}${role==='employer'?btn('Create estimate','job-estimate','receipt','',`data-id="${j.id}"`)+btn('Create invoice','job-invoice','receipt','primary',`data-id="${j.id}"`):''}</div>`,btn('Print job card','print-job','print','',`data-id="${j.id}"`)+btn('Done','close','','primary'),true,'A clear picture of every job, from start to finish.');}
function partForm(id){if(role!=='employer')return;const p=state.inventory.find(p=>p.id===id)||{unit:'piece',min:3};formModal(id?'Update inventory':'Add a spare part',`<input name="id" type="hidden" value="${id||''}"><div class="form-grid">${field('Part name','name',p.name,'text',true,true)}${selectField('Category','category',Object.keys(PART_GROUPS),p.category)}${field('Quantity in stock','stock',p.stock??0,'number',true,false,'min="0" max="1000000" step=".01"')}${field('Price per unit (₹)','price',p.price??0,'number',true,false,'min="0" max="10000000" step=".01"')}${field('Low-stock threshold','min',p.min,'number',true,false,'min="0" max="1000000" step=".01"')}${selectField('Unit','unit',['piece','litre','set','pair','kg','can'],p.unit)}${field('Brand / model compatibility','fitment',p.fitment||'','text',false,true)}</div>`,'part',false,'Employer controls opening stock, restocking and prices.');}
function issuePart(id){const p=state.inventory.find(p=>p.id===id);const jobs=state.jobs.filter(j=>role==='employer'||j.assigned===currentEmployee());if(!jobs.length)return toast('Create an assigned job card before issuing stock.');formModal('Issue stock to a job',`<input type="hidden" name="id" value="${p.id}"><div class="info"><strong>${esc(p.name)}</strong><br>${p.stock} ${p.unit} available · ${money(p.price)} per ${p.unit}</div><div class="form-grid">${selectField('Job card','job',jobs.map(j=>[j.id,`${j.id} · ${j.brand} ${j.model} · ${customer(j).name}`]),'',true)}${field('Quantity to issue','qty',1,'number',true,true,`min="0.01" max="${p.stock}" step=".01"`)}</div><p class="notice-inline">This reduces stock and adds the part to the selected job’s billable items.</p>`,'issue');}
function requestStock(id){const p=state.inventory.find(p=>p.id===id);formModal('Request a part',`<div class="form-grid">${field('Part name','name',p?.name||'','text',true,true)}${field('Quantity needed','qty',1,'number',true,false,'min="1" max="1000000"')}${field('Reason / vehicle details','note','','textarea',false,true)}</div>`,'request',false,'The employer can review and restock requested items.');}
function requestsModal(){openModal('Stock requests',state.requests.map(r=>`<div class="notice-row"><div class="actions" style="justify-content:space-between"><strong>${esc(r.name)} · ${r.qty} requested</strong>${badge(r.status)}</div><p>${esc(employee(r.employee).name)} · ${r.date}<br>${esc(r.note)}</p>${role==='employer'&&r.status!=='Resolved'?`<div class="actions" style="margin-top:12px">${btn('Restock / add item','request-restock','box','small',`data-id="${r.id}"`)}${btn('Mark resolved','request-resolve','check','small',`data-id="${r.id}"`)}</div>`:''}</div>`).join('')||'<div class="empty">No stock requests yet.</div>',btn('Request a part','request-stock','plus','primary'));}
function employeeForm(id){if(role!=='employer')return;const e=state.employees.find(e=>e.id===id)||{};formModal(id?'Edit team member':'Add to your team',`<input type="hidden" name="id" value="${id||''}"><div class="form-grid">${field('Full name','name',e.name,'text',true)}${field('Job role','job',e.job,'text',true)}${field('Phone','phone',e.phone,'tel',true)}${field('Email (optional)','email',e.email,'email')}<div class="form-group full"><label for="employee-password">${id?'Set a new password (leave blank to keep existing)':'Set employee password *'}</label><input id="employee-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" ${id?'':'required'} placeholder="At least 8 characters"></div></div><div class="info" style="margin:18px 0 0">The employee’s phone number is their login username. The password is set on the server and is never stored in the spreadsheet.</div>`,'employee');}
function billLine(name='',qty=1,price=0){return `<div class="billing-line"><input name="lineName" aria-label="Item description" value="${esc(name)}" placeholder="Item / service" required><input name="lineQty" aria-label="Quantity" type="number" value="${qty}" min=".01" max="1000000" step=".01" required><input name="linePrice" aria-label="Unit price" type="number" value="${price}" min="0" max="10000000" step=".01" required><button type="button" class="iconbtn" data-action="remove-line" aria-label="Remove line">${icon('close')}</button></div>`}
function billForm(type='Invoice',jobId=''){if(role!=='employer')return;if(!state.jobs.length)return toast('Create a job card first.');const j=state.jobs.find(j=>j.id===jobId)||state.jobs[0];formModal(`Create ${type.toLowerCase()}`,`<input type="hidden" name="type" value="${type}"><div class="form-grid">${selectField('Job card / customer','job',state.jobs.map(j=>[j.id,`${j.id} · ${customer(j).name} · ${j.plate}`]),j.id,true)}${field('Document date','date',today,'date',true)}</div><div class="section-label">Description · quantity · unit price</div><div id="bill-lines">${jobBillLines(j)}</div>${btn('Add line item','add-bill-line','plus','small')}<div class="form-grid" style="margin-top:20px">${field('Discount (₹)','discount',0,'number',true,false,'min="0" step=".01"')}${field('Tax (%)','tax',0,'number',true,false,'min="0" max="100" step=".01"')}</div><div class="billing-total" id="bill-total"></div><p class="notice-inline">Verify prices and your applicable tax before issuing. Shop details and customer details are added automatically.</p>`,'bill',true,'Print directly or save as PDF from the browser print dialog.');updateBillTotal();}
function jobBillLines(j){return j.services.map(s=>billLine(s.name,1,s.price)).join('')+j.issued.map(p=>billLine(p.name,p.qty,p.price)).join('')}
function readBillLines(){return $$('.billing-line').map(r=>({name:$('[name=lineName]',r).value.trim(),qty:Number($('[name=lineQty]',r).value),price:Number($('[name=linePrice]',r).value)}))}
function updateBillTotal(){const el=$('#bill-total');if(!el)return;const i={lines:readBillLines(),discount:Number($('[name=discount]').value),tax:Number($('[name=tax]').value)};el.innerHTML=`Total payable<strong>${money(total(i))}</strong>`}
function documentHeader(type,id,date){const s=state.settings;return `<div class="doc-header"><div>${s.logo?`<img class="doc-logo" src="${s.logo}" alt="Workshop logo">`:''}<h1>${esc(s.name)}</h1><p>${esc(s.address)}<br>Call / WhatsApp: ${esc(s.phone)}${s.gst?`<br>GSTIN: ${esc(s.gst)}`:''}</p></div><div style="text-align:right"><h2>${type.toUpperCase()}</h2><p>${id}<br>Date: ${date}</p></div></div>`}
function billDocument(i){const j=state.jobs.find(j=>j.id===i.job),c=customer(j),subtotal=i.lines.reduce((s,l)=>s+l.qty*l.price,0),taxable=Math.max(0,subtotal-i.discount);return `<article class="document">${documentHeader(i.type,i.id,i.date)}<div class="doc-details"><div><strong>Bill to</strong><br>${esc(c.name)}<br>${esc(c.address)}<br>WhatsApp: +${esc(c.phone)}</div><div><strong>${esc(j.brand)} ${esc(j.model)}</strong><br>Registration: ${esc(j.plate)}<br>Job card: ${j.id}<br>${i.type==='Estimate'?'Estimate — not a payment receipt':`Payment: ${i.status}`}</div></div><table><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>${i.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</tbody></table><div class="doc-total"><div><span>Subtotal</span><span>${money(subtotal)}</span></div><div><span>Discount</span><span>− ${money(i.discount)}</span></div><div><span>Tax (${i.tax}%)</span><span>${money(taxable*i.tax/100)}</span></div><div class="grand"><span>Total</span><span>${money(total(i))}</span></div></div><p class="doc-note">${i.type==='Estimate'?'Estimated charges are subject to inspection and customer approval.<br>':''}${esc(state.settings.footer)}</p><div class="doc-sign"><span>Customer signature</span><span>For ${esc(state.settings.name)}<br>Authorized signature</span></div></article>`}
function jobDocument(j){const c=customer(j);return `<article class="document">${documentHeader('Job card',j.id,j.date)}<div class="doc-details"><div><strong>${esc(c.name)}</strong><br>${esc(c.address)}<br>WhatsApp: +${esc(c.phone)}</div><div><strong>${esc(j.brand)} ${esc(j.model)} · ${esc(j.plate)}</strong><br>${esc(j.odometer||'—')} km · ${esc(j.fuel)}<br>Assigned: ${esc(employee(j.assigned).name)}<br>Expected: ${j.due}</div></div><p class="doc-note" style="margin-bottom:20px"><strong>Customer concerns / inspection notes</strong><br>${esc(j.notes||'—')}</p><table><thead><tr><th>Work requested</th><th>Type</th><th>Status</th><th>Labour</th></tr></thead><tbody>${j.services.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.type||'Service')}</td><td>${esc(s.status)}</td><td>${money(s.price)}</td></tr>`).join('')}</tbody></table>${j.issued.length?`<p class="doc-note"><strong>Parts issued:</strong> ${j.issued.map(p=>`${esc(p.name)} × ${p.qty}`).join(', ')}</p>`:''}<p class="doc-note">Vehicle condition / additional inspection notes:<br><br>________________________________________________________________<br><br>________________________________________________________________</p><p class="doc-note">I authorize inspection and the work listed above, subject to agreed charges.</p><div class="doc-sign"><span>Customer approval / signature</span><span>Service advisor / technician</span></div><p class="doc-note">${esc(state.settings.footer)}</p></article>`}
function printDoc(html){$('#print-root').innerHTML=html;window.print()}
function invoicePreview(id){const i=state.invoices.find(i=>i.id===id);openModal(`${i.type} · ${i.id}`,billDocument(i),btn('Print / Save PDF','print-invoice','print','primary',`data-id="${id}"`),true);}
function whatsapp(id){const j=state.jobs.find(j=>j.id===id),c=customer(j);const msg=`Hello ${c.name}, here is an update from ${state.settings.name}.\n\nVehicle: ${j.brand} ${j.model} (${j.plate})\nJob card: ${j.id}\nCurrent status: ${jobStatus(j)}\n${j.services.map(s=>`• ${s.name}: ${s.status}`).join('\n')}\n\nAssigned technician: ${employee(j.assigned).name}\nExpected completion: ${j.due}\nFor any questions, call ${state.settings.phone}.\nThank you!`;openModal('A quick update for your customer',`<div class="info">To ${esc(c.name)} · +${esc(c.phone)}<br>Review the message, then open WhatsApp. You choose when to send.</div><label class="small muted" for="whatsapp-message">Message</label><textarea id="whatsapp-message" style="min-height:280px;margin-top:9px">${esc(msg)}</textarea>`,btn('Clear','clear-message','close')+btn('Cancel','close')+btn('Open WhatsApp','open-whatsapp','chat','primary',`data-id="${id}"`));}
function customerDetail(id){const c=state.customers.find(c=>c.id===id);openModal(esc(c.name),`<div class="detail-banner">${avatar(c.name)}<div><h2>${esc(c.brand)} ${esc(c.model)}</h2><p>${esc(c.plate)}</p></div></div><div class="detail-info"><div><small>WhatsApp</small>+${esc(c.phone)}</div><div style="grid-column:span 2"><small>Address</small>${esc(c.address)}</div></div><div class="section-label">Service history</div>${state.jobs.filter(j=>j.customer===id).map(j=>`<div class="task"><button class="job-id" data-action="job-detail" data-id="${j.id}">${j.id} · ${j.date}</button>${badge(jobStatus(j))}</div>`).join('')||'<p class="small muted">No visits yet.</p>'}`,btn('Edit customer','edit-customer','edit','primary',`data-id="${id}"`));}
function bindSearch(){const inp=$('#search');if(inp)inp.addEventListener('input',()=>{const start=inp.selectionStart;query=inp.value;render();const n=$('#search');n.focus();n.setSelectionRange(start,start)})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'menu':$('.sidebar').classList.toggle('open');$('.mobile-scrim').classList.toggle('show');break;case'nav':page=b.dataset.page;query='';jobFilter='All jobs';render();window.scrollTo(0,0);break;case'logout':logoutRemote();break;case'role':if(!session?.admin)break;role=b.dataset.role;query='';closeModal();render();toast(`${role==='employer'?'Employer':'Employee'} view · Admin preview`);break;case'date':toast(`Showing workshop activity for ${fullDate()}`);break;case'close':closeModal();break;case'new-job':newJob();break;case'new-customer':newCustomer();break;case'edit-customer':newCustomer(id);break;case'customer-detail':customerDetail(id);break;case'new-employee':employeeForm();break;case'edit-employee':employeeForm(id);break;case'new-part':partForm();break;case'edit-part':partForm(id);break;case'issue-part':issuePart(id);break;case'request-stock':requestStock(id);break;case'requests':requestsModal();break;case'request-restock':{const r=state.requests.find(r=>r.id===id),p=state.inventory.find(p=>p.name.toLowerCase()===r.name.toLowerCase());partForm(p?.id);if(!p)$('[name=name]').value=r.name;break}case'request-resolve':if(role==='employer'){state.requests.find(r=>r.id===id).status='Resolved';render();requestsModal();toast('Request marked resolved in preview.')}break;case'job-detail':jobDetail(id);break;case'job-filter':jobFilter=b.dataset.value;render();break;case'view-grid':view='grid';render();break;case'view-list':view='list';render();break;case'go-jobs':closeModal();page='Job cards';query='';jobFilter='All jobs';render();break;case'go-inventory':closeModal();page='Inventory';query='';render();break;case'go-attendance':closeModal();page='Attendance';query='';render();break;case'add-service':$('#service-lines').insertAdjacentHTML('beforeend',serviceLine());break;case'remove-line':{const line=b.closest('.service-line,.billing-line');if(line.parentElement.children.length>1){line.remove();updateBillTotal()}else toast('Keep at least one line item.');break}case'new-invoice':billForm('Invoice');break;case'new-estimate':billForm('Estimate');break;case'job-invoice':billForm('Invoice',id);break;case'job-estimate':billForm('Estimate',id);break;case'add-bill-line':$('#bill-lines').insertAdjacentHTML('beforeend',billLine());updateBillTotal();break;case'invoice-preview':invoicePreview(id);break;case'mark-paid':if(role==='employer'){Object.assign(state.invoices.find(i=>i.id===id),{status:'Paid',paidDate:today});render();toast('Marked paid. Dashboard sales updated.')}break;case'convert-invoice':{if(role!=='employer')break;const old=state.invoices.find(i=>i.id===id),i={...structuredClone(old),id:nextDocId('Invoice'),type:'Invoice',status:'Unpaid',date:today};state.invoices.push(i);render();invoicePreview(i.id);break}case'print-invoice':printDoc(billDocument(state.invoices.find(i=>i.id===id)));break;case'print-job':printDoc(jobDocument(state.jobs.find(j=>j.id===id)));break;case'whatsapp':whatsapp(id);break;case'open-whatsapp':{const c=customer(state.jobs.find(j=>j.id===id)),phone=c.phone.replace(/\D/g,'');if(!/^\d{10,15}$/.test(phone)){toast('Add a valid WhatsApp number including country code.');break}window.open(`https:\x2f\x2fwa.me/${phone}?text=${encodeURIComponent($('#whatsapp-message').value)}`,'_blank','noopener,noreferrer');toast('WhatsApp opened with your message. Send it there.');break}case'clock':requestCheckinOrCheckout();break;case'add-attendance':addAttendance();break;case'brand':{const brand=b.dataset.brand;openModal(esc(brand),`<p class="small muted" style="margin-bottom:18px">Current and historical Indian-market model suggestions.</p><div class="models">${CARS[brand].map(m=>`<span>${esc(m)}</span>`).join('')}</div>`,btn('Done','close','','primary'));break}case'save-settings':saveSettings();break;case'notifications':openModal('Your workshop updates',`${role==='employer'?approvalBanner():''}<div class="notice-row"><strong>${state.jobs.filter(j=>jobStatus(j)==='Finished').length} vehicles ready for delivery</strong><p>Open a finished job card to prepare an invoice and send the customer a WhatsApp update.</p>${txtbtn('View job cards','go-jobs')}</div><div class="notice-row"><strong>${state.requests.filter(r=>r.status==='Requested').length} stock requests pending</strong><p>Review requests from your team and update inventory.</p>${txtbtn('Review requests','requests')}</div>`,btn('Done','close','','primary'));break;}}
);
document.addEventListener('change',e=>{const el=e.target;if(el.id==='category'){category=el.value;render()}if(el.id==='chart-range'){chartRange=el.value;render()}if(el.name==='brand'){const modelInput=$('[name=model]');if(modelInput)modelInput.value='';const models=$('#models');if(models)models.innerHTML=(CARS[el.value]||[]).map(m=>`<option value="${esc(m)}">`).join('');}if(el.name==='customer'&&el.value&&$('#modal-form')?.dataset.submit==='job'){const c=state.customers.find(c=>c.id===el.value);['brand','model','plate'].forEach(k=>$(`[name=${k}]`).value=c[k]);$('#models').innerHTML=(CARS[c.brand]||[]).map(m=>`<option value="${esc(m)}">`).join('')}if(el.name==='job'&&el.value&&$('#bill-lines')){$('#bill-lines').innerHTML=jobBillLines(state.jobs.find(j=>j.id===el.value));updateBillTotal()}if(el.classList.contains('task-status')){const j=state.jobs.find(j=>j.id===el.dataset.id);j.services[Number(el.dataset.index)].status=el.value;render();jobDetail(j.id);toast('Task status updated in preview.')}if(el.id==='detail-assigned'){state.jobs.find(j=>j.id===el.dataset.id).assigned=el.value;render();toast('Assignment updated in preview.')}if(el.id==='logo-file')loadLogo(el.files[0]);});
document.addEventListener('input',e=>{if(e.target.closest('#modal-form')&&$('#bill-total'))updateBillTotal()});
function nextDocId(type){const prefix=type==='Invoice'?'INV':'EST';return `${prefix}-${new Date().getFullYear()}-${String(state.invoices.filter(i=>i.type===type).length+1).padStart(3,'0')}`}
document.addEventListener('submit',async e=>{if(e.target.getAttribute('id')==='admin-profile-form'){e.preventDefault();saveAdminProfile();return;}if(e.target.getAttribute('id')==='settings-form'){e.preventDefault();saveSettings();return;}if(e.target.getAttribute('id')==='login-form'){e.preventDefault();await login(e.target);return;}if(e.target.getAttribute('id')!=='modal-form')return;e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));for(const [k,v]of Object.entries(d))if(typeof v==='string'&&k!=='password')d[k]=v.trim();const kind=f.dataset.submit;try{switch(kind){case'customer':{const phone=d.phone.replace(/\D/g,'');if(!/^\d{10,15}$/.test(phone))return error('Enter a WhatsApp number with country code (10–15 digits).');const record={id:d.id||`c${Date.now()}`,name:d.name,phone,address:d.address,brand:d.brand,model:d.model,plate:d.plate.toUpperCase()};if(!d.name||!d.brand||!d.model||!d.plate)return error('Name, brand, model and registration are required.');const old=state.customers.find(c=>c.id===d.id);if(old)Object.assign(old,record);else state.customers.push(record);break}case'job':{if(!state.customers.some(c=>c.id===d.customer)||!state.employees.some(e=>e.id===(role==='employee'?currentEmployee():d.assigned)))return error('Choose a customer and employee.');const services=$$('.service-line').map(r=>({name:$('[name=serviceName]',r).value.trim(),price:Number($('[name=servicePrice]',r).value),type:$('[name=serviceType]',r).value,status:'Pending'}));if(!services.length||services.some(s=>!s.name||!Number.isFinite(s.price)||s.price<0))return error('Add at least one task with a valid charge.');state.jobs.unshift({id:`JC-${Math.max(...state.jobs.map(j=>Number(j.id.split('-')[1])),1040)+1}`,customer:d.customer,assigned:role==='employee'?currentEmployee():d.assigned,date:today,due:d.due,brand:d.brand,model:d.model,plate:d.plate.toUpperCase(),odometer:Number(d.odometer)||0,fuel:d.fuel,notes:d.notes,services,issued:[]});page='Job cards';query='';jobFilter='All jobs';break}case'part':{if(role!=='employer')return;if(!d.category||!d.unit)return error('Choose a category and unit.');const record={name:d.name,category:d.category,stock:Number(d.stock),price:Number(d.price),min:Number(d.min),unit:d.unit,fitment:d.fitment||'Confirm vehicle compatibility',configured:true};if(!record.name||[record.stock,record.price,record.min].some(n=>!Number.isFinite(n)||n<0))return error('Enter a part name and valid non-negative amounts.');const old=state.inventory.find(p=>p.id===d.id);if(old)Object.assign(old,record);else state.inventory.unshift({...record,id:`P-${state.inventory.length+1}`});break}case'issue':{const p=state.inventory.find(p=>p.id===d.id),j=state.jobs.find(j=>j.id===d.job),qty=Number(d.qty);if(!j||!p)return error('Choose a valid job and part.');if(!Number.isFinite(qty)||qty<=0||qty>p.stock)return error('Quantity must be greater than zero and within available stock.');p.stock=Math.round((p.stock-qty)*100)/100;j.issued.push({name:p.name,qty,price:p.price,part:p.id});break}case'request':if(!d.name)return error('Enter the requested part name.');state.requests.unshift({id:`R-${Date.now()}`,name:d.name,qty:Number(d.qty),note:d.note,employee:currentEmployee(),date:today,status:'Requested'});break;case'employee':{if(role!=='employer')return;const old=state.employees.find(x=>x.id===d.id);const phone=d.phone.replace(/\D/g,'');if(!/^\d{10,15}$/.test(phone))return error('Enter a valid phone number (10–15 digits).');if(state.employees.some(e=>e.phone===phone&&e.id!==d.id))return error('This phone number is already used by another employee.');if(!old&&!d.password)return error('Set a password for the employee.');if(d.password&&d.password.length<8)return error('Use at least 8 characters for the password.');const record={id:d.id||`e${Date.now()}`,name:d.name,job:d.job,email:d.email,phone,passwordHash:d.password?await hashPassword(d.password):old?.passwordHash};if(old)Object.assign(old,record);else state.employees.push(record);break}case'attendance':{if(!saveAttendanceForm(d))return;break}case'bill':{if(role!=='employer')return;if(!state.jobs.some(j=>j.id===d.job))return error('Choose a job card.');const lines=readBillLines();if(lines.some(l=>!l.name||!Number.isFinite(l.qty)||l.qty<=0||!Number.isFinite(l.price)||l.price<0))return error('Every line needs a description, positive quantity and valid price.');const subtotal=lines.reduce((s,l)=>s+l.qty*l.price,0);if(Number(d.discount)>subtotal)return error('Discount cannot exceed the subtotal.');const i={id:nextDocId(d.type),job:d.job,type:d.type,date:d.date,status:d.type==='Estimate'?'Estimate':'Unpaid',lines,discount:Number(d.discount),tax:Number(d.tax)};state.invoices.push(i);closeModal();page='Invoices & estimates';render();invoicePreview(i.id);toast(`${d.type} created in preview.`);return}}
closeModal();render();toast('Updated in this preview. Changes reset on refresh.');}catch(err){error('Please check the entered details and try again.');console.error(err)}});
let pendingLogo=null;
function loadLogo(file){if(!file)return;if(!['image/png','image/jpeg'].includes(file.type)||file.size>2*1024*1024)return toast('Choose a PNG or JPG under 2 MB.');const reader=new FileReader();reader.onload=()=>{pendingLogo=reader.result;$('#logo-preview').innerHTML=`<img src="${reader.result}" alt="Uploaded logo preview">`};reader.readAsDataURL(file)}
function saveSettings(){if(role!=='employer')return;const f=$('#settings-form');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));if(!d.name.trim()||!d.phone.trim()||!d.address.trim())return toast('Add your shop name, phone and address.');Object.assign(state.settings,d);if(pendingLogo!==null){state.settings.logo=pendingLogo;pendingLogo=null}render();toast('Shop details updated for this preview’s documents.');}
document.addEventListener('keydown',e=>{if(!$('.modal'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const focusables=$$('button,input,select,textarea,a[href]', $('.modal')).filter(el=>!el.disabled&&el.offsetParent!==null);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function currentEmployee(){return session?.employee||'e1'}
async function hashPassword(value){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));return Array.from(new Uint8Array(bytes)).map(b=>b.toString(16).padStart(2,'0')).join('')}
